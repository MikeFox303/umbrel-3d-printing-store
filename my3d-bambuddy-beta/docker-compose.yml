version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: 192.168.0.100
      APP_PORT: 8001
      PROXY_AUTH_ADD: "false"
    container_name: my3d-bambuddy-beta_app_proxy_1
  server:
    image: ghcr.io/maziggy/bambuddy:1.2.5.5@sha256:dc627d618cc3d3252ae4ab33af74c4679c66a9a06e0e3bbb7aefa32d1a4d4a07
    restart: on-failure
    init: true
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: Europe/Kyiv
      PUID: "1000"
      PGID: "1000"
      PORT: "8001"
      VIRTUAL_PRINTER_ADVERTISE_ADDRESS: 192.168.0.100
      VIRTUAL_PRINTER_PASV_ADDRESS: 192.168.0.100
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs
    container_name: my3d-bambuddy-beta_server_1

version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: 192.168.0.100
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"
    container_name: my3d-bambuddy_app_proxy_1
  server:
    image: ghcr.io/maziggy/bambuddy:1.2.5.6@sha256:38ab9d681550c40ac4025892e34eb7bc39cce4e84e9ab507b144b345a29ff367
    restart: on-failure
    init: true
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: Europe/Kyiv
      PUID: "1000"
      PGID: "1000"
      PORT: "8000"
      VIRTUAL_PRINTER_ADVERTISE_ADDRESS: 192.168.0.100
      VIRTUAL_PRINTER_PASV_ADDRESS: 192.168.0.100
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs
    container_name: my3d-bambuddy_server_1

version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: server
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"
    container_name: my3d-bambuddy_app_proxy_1
  server:
    image: ghcr.io/maziggy/bambuddy:1.2.5.7@sha256:807f67511fa8c2b644b09de50a5d41794372214d00bd04fda59f576d9958d280
    restart: on-failure
    init: true
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    # Keep the X2D on a stable DHCP reservation at 192.168.0.151.
    # The route uses the container's default Umbrel bridge gateway dynamically.
    post_start:
      - command: /bin/sh -c 'GW="$(ip route | grep "^default " | cut -d" " -f3 | head -1)"; test -n "$GW"; ip route replace 192.168.0.151/32 via "$GW"'
        user: root
    environment:
      TZ: Europe/Kyiv
      PUID: "1000"
      PGID: "1000"
      PORT: "8000"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs
    container_name: my3d-bambuddy_server_1
    networks:
      default:
        gw_priority: 1
      bambuddy_lan:
        ipv4_address: 192.168.0.200
        gw_priority: 0

networks:
  default:
    external: true
    name: umbrel_main_network
  bambuddy_lan:
    external: true
    name: bambuddy_lan

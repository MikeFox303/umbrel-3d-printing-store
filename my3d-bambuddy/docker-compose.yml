version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: my3d-bambuddy_server_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"
  server:
    image: ghcr.io/mikefox303/bambuddy:1.2.5.3-test.2892.1@sha256:debe95e8b4048f9f34e9c98016ce116cafda239035613f409cf26222dc2838e5
    restart: on-failure
    init: true
    environment:
      TZ: Europe/Kyiv
      PUID: "1000"
      PGID: "1000"
      PORT: "8000"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs

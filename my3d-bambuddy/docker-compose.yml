version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: server
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"
    container_name: my3d-bambuddy_app_proxy_1
  server:
    image: ghcr.io/maziggy/bambuddy:1.3.1@sha256:3b63f6b02ab77075716a6295d6f8ca27b98283580753b911b3841dcd9972a110
    restart: on-failure
    init: true
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: Europe/Kyiv
      PUID: "1000"
      PGID: "1000"
      PORT: "8000"
      VIRTUAL_PRINTER_ADVERTISE_ADDRESS: 192.168.0.100
      VIRTUAL_PRINTER_PASV_ADDRESS: 192.168.0.100
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs
    container_name: my3d-bambuddy_server_1
    ports:
      - "21:21"
      - "322:322"
      - "990:990"
      - "3000:3000"
      - "3002:3002"
      - "6000:6000"
      - "8883:8883"
      - "2024-2026:2024-2026"
      - "50000-50100:50000-50100"
    networks:
      default:
        # Stay in the top of the Umbrel /16, far outside the 10.21.0.0/24
        # block Docker allocates dynamically. A stopped Bambuddy container
        # must never lose this address to another app.
        ipv4_address: 10.21.250.200
        gw_priority: 1

networks:
  default:
    external: true
    name: umbrel_main_network

version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: my3d-bambuddy_server_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"
  server:
    image: ghcr.io/mikefox303/bambuddy:1.2.5.5-x2d.71@sha256:2b2e98d0c19979b5b728037794d51b5b0ed46d97db439c603c10459c607a2f36
    restart: on-failure
    init: true
    environment:
      TZ: Europe/Kyiv
      PUID: "1000"
      PGID: "1000"
      PORT: "8000"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs

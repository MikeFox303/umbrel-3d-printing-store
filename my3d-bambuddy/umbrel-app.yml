manifestVersion: 1.1
id: my3d-bambuddy
name: Bambuddy
category: automation
version: "1.2.5.5"
tagline: Локальное управление принтерами Bambu Lab
description: >-
  Community App package для официального Bambuddy. Bambuddy — self-hosted
  система управления и мониторинга принтеров Bambu Lab: печать, AMS, камера,
  архив заданий, Virtual Printer и API-интеграции в локальной сети. Этот пакет
  устанавливает проверенный bootstrap runtime; последующие проверенные
  Stable/Beta версии можно применять через отдельный Bambuddy Manager.
developer: maziggy
website: https://bambuddy.cool/
repo: https://github.com/maziggy/bambuddy
support: https://github.com/maziggy/bambuddy/issues
icon: https://raw.githubusercontent.com/maziggy/bambuddy/main/static/img/android-chrome-512x512.png
port: 8280
gallery: []
dependencies: []
path: ""
torOnly: false
releaseNotes: >-
  Официальный upstream Bambuddy 1.2.5.5 по immutable multi-arch digest.
  Сохраняется рабочая конфигурация Umbrel Virtual Printer: network_mode host,
  APP_HOST 192.168.0.100 и advertise/PASV адреса 192.168.0.100. Новые upstream
  Stable/Beta версии сначала проходят Store CI и публикуются как channel
  metadata; Bambuddy Manager применяет их с snapshot, health-check и rollback.

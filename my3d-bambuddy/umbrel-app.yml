manifestVersion: 1.1
id: my3d-bambuddy
name: Bambuddy
category: automation
version: "1.2.5.6"
tagline: Локальное управление принтерами Bambu Lab
description: >-
  Community App package для официального Bambuddy. Bambuddy — self-hosted
  система управления и мониторинга принтеров Bambu Lab: печать, AMS, камера,
  архив заданий, Virtual Printer и API-интеграции в локальной сети. Проверенные
  Stable-релизы автоматически публикуются как обычные обновления Umbrel App;
  Bambuddy Manager остаётся отдельным инструментом для Beta и rollback.
developer: maziggy
website: https://bambuddy.cool/
repo: https://github.com/maziggy/bambuddy
support: https://github.com/maziggy/bambuddy/issues
icon: https://raw.githubusercontent.com/maziggy/bambuddy/main/static/img/android-chrome-512x512.png
port: 8280
gallery: []
dependencies: []
path: ""
torOnly: false
releaseNotes: >-
  Официальный upstream Bambuddy 1.2.5.6, закреплённый по immutable multi-arch digest.
  FilaMan-specific fork code не используется runtime; Spoolman — рекомендуемый inventory backend.

manifestVersion: 1.1
id: my3d-foxforge
name: FoxForge
category: automation
version: "0.1.0-alpha.4.1"
tagline: Единое управление Bambu Lab и Moonraker/Klipper
description: >-
  FoxForge — open-source self-hosted платформа управления 3D-принтерами с
  vendor-independent архитектурой, глубокой поддержкой Bambu Lab,
  Moonraker/Klipper, очередью печати, управлением заданиями и учётом филамента.
  Alpha-интерфейс доступен на английском, русском и украинском языках.
developer: MikeFox303
website: https://github.com/MikeFox303/FoxForge
repo: https://github.com/MikeFox303/FoxForge
support: https://github.com/MikeFox303/FoxForge/issues
icon: https://raw.githubusercontent.com/MikeFox303/umbrel-3d-printing-store/main/my3d-foxforge/icon.svg
port: 8283
gallery: []
dependencies: []
path: ""
torOnly: false
releaseNotes: >-
  FoxForge v0.1.0-alpha.4.1 — первый hotfix для Alpha 4. Исправлены
  responsive-регрессии интерфейса на телефонах, обычных 16:9 и ultra-wide 32:9
  экранах: операторский Unlock writes теперь компактен и не перекрывает рабочую
  область, Add Printer возвращён в поток topbar, мобильная навигация больше не
  растягивается содержимым страницы, сохранён iOS safe-area и устранён
  горизонтальный overflow на узких экранах. Релиз прошёл production browser,
  backend/frontend, security и container gates. Umbrel использует тот же
  уникальный APP_PASSWORD как FOXFORGE_COMMAND_TOKEN; данные в /data сохраняются
  при обновлении. Образ закреплён на immutable amd64/arm64 digest.

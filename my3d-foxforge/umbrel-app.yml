path: ""
deterministicPassword: true
torOnly: false
releaseNotes: >-
  FoxForge v0.1.0-alpha.4.3 — третий hotfix Alpha 4. Исправлено падение команд
  в iOS Safari/WebKit при открытии FoxForge по обычному HTTP LAN-адресу: при
  отсутствии crypto.randomUUID теперь используется криптографический UUIDv4
  fallback через crypto.getRandomValues. Добавлены unit/browser regression
  tests. Это восстанавливает Add Printer и другие write-flow (очередь,
  инвентарь, Pause/Resume/Cancel) в таком окружении. Схемы /data и транспорты
  принтеров не менялись. Образ закреплён на immutable amd64/arm64 OCI digest.

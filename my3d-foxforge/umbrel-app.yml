releaseNotes: >-
  Pre-Alpha 5 validation candidate 2, не финальный v0.1.0-alpha.5. Umbrel
  package identity 0.1.0-alpha.4.3-umbrel.2 keeps the published Alpha 4.3
  release as the audited base while explicitly carrying FoxForge commit
  37b253f385c19451c7ea075a4a4d12378cf17cf2. Образ закреплён на immutable
  amd64/arm64 OCI digest
  sha256:e550c8026ed6ec80e973d91fe6d96cc1474d537ca87de7875ec54f4a03aaaa4f.
  Помимо Bambu test-before-save, LAN discovery, structured connection errors,
  reconnect diagnostics и live AMS foundation, candidate 2 исправляет два
  release-audit дефекта: Update Printer теперь проверяет новое соединение до
  замены рабочей конфигурации и откатывается при неудаче, а повтор failed
  Add/Update с тем же idempotency key детерминированно возвращает тот же
  безопасный terminal error вместо reconciliation_required. Эта сборка
  предназначена для физической проверки Raspberry Pi 5 + Umbrel + X2D +
  AMS 2 Pro; выпуск Alpha 5 возможен только после фиксации результатов реального
  тестирования.

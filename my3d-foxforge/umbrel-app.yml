releaseNotes: >-
  Pre-Alpha 5 validation candidate 6, не финальный v0.1.0-alpha.5. Package
  0.1.0-alpha.4.3-umbrel.6 carries FoxForge commit
  a2a0c54f392de8085a6a9635920a6da465d8fbe8 and immutable amd64/arm64 digest
  sha256:d6eef7e5f564ae3d639d39e4737368a97ff6724c6ab874151a839a0ed408884b.
  Candidate 5 выведен из physical acceptance после реальной проверки X2D:
  Docker/LAN discovery и MQTT authentication проходили, но FoxForge ошибочно
  требовал gcode_state в initial incremental push_status и поэтому завершал
  authoritative save preflight как initial_state_timeout. Candidate 6 принимает
  валидный state-bearing partial push_status без ослабления MQTT authentication,
  а также поддерживает X2D/H2-family vir_slot как полный список внешних источников
  с приоритетом над legacy vt_tray. Сохраняются routing-audit fail-closed guards,
  TOOLHEAD_METADATA_INVALID, compiler-owned toolhead/nozzle mapping, staged Add
  Printer Provider → Connection → Identity → Verify и повторный backend preflight
  перед записью. Физическая проверка Raspberry Pi 5 + Umbrel + X2D + AMS 2 Pro
  должна быть повторена на Candidate 6 до Alpha 5; физический Start пока запрещён.

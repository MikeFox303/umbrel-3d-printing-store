releaseNotes: >-
  Pre-Alpha 5 validation Candidate 7, не финальный v0.1.0-alpha.5. Package
  0.1.0-alpha.4.3-umbrel.7 pins FoxForge source
  4f769ca89d466d2cbe41360848b6343ec5a8eb36 and immutable amd64/arm64 OCI digest
  sha256:0000e7a6c74056a0fff2e019c31a8cffc6d7fb2d3ec1fefdf587354a4d64c9b7.
  Candidate 7 replaces the failed Candidate 6 physical identity after the real X2D
  Add Printer test exposed rapid overlapping/reused Bambu MQTT sessions. The new
  build keeps staged Add Printer verification while using one backend-authoritative
  live Add connection and per-session MQTT client IDs, with sanitized public errors
  and server-side exception logging. It retains the capability-driven Printer Detail
  and Material Topology UI, Bambu thermal telemetry, fail-closed compiler-owned 3MF
  routing, AMS/external source handling and Bambu-only physical-validation filament
  accounting mode. Umbrel still maps APP_PASSWORD to the FoxForge operator token;
  host networking, privileged mode and Docker socket are not used. Raspberry Pi 5 +
  Umbrel + X2D + AMS 2 Pro physical validation must be repeated on this exact identity
  before final Alpha 5 publication.

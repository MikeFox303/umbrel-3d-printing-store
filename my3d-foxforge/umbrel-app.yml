manifestVersion: 1.1
id: my3d-foxforge
name: FoxForge
category: automation
version: "0.1.0-alpha.4.2"
tagline: Единое управление Bambu Lab и Moonraker/Klipper
description: >-
  FoxForge — open-source self-hosted платформа управления 3D-принтерами с
  vendor-independent архитектурой, глубокой поддержкой Bambu Lab,
  Moonraker/Klipper, очередью печати, управлением заданиями и учётом филамента.
  Alpha-интерфейс доступен на английском, русском и украинском языках.
developer: MikeFox303
website: https://github.com/MikeFox303/FoxForge
repo: https://github.com/MikeFox303/FoxForge
support: https://github.com/MikeFox303/FoxForge/issues
icon: https://raw.githubusercontent.com/MikeFox303/umbrel-3d-printing-store/main/my3d-foxforge/icon.svg
port: 8283
gallery: []
dependencies: []
path: ""
torOnly: false
releaseNotes: >-
  FoxForge v0.1.0-alpha.4.2 — второй hotfix для Alpha 4. Устранены оставшиеся
  responsive- и stacking-регрессии Operator Access и Add Printer на телефонах,
  планшетах, 16:9 и ultra-wide 32:9 экранах; добавлены browser-runtime и CSS
  token regression checks. Exact release commit прошёл production browser,
  backend/frontend, security и container gates. Umbrel продолжает использовать
  уникальный APP_PASSWORD как FOXFORGE_COMMAND_TOKEN; данные в /data сохраняются
  при обновлении. Образ закреплён на immutable amd64/arm64 OCI digest.

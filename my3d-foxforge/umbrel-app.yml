releaseNotes: >-
  Pre-Alpha 5 validation candidate 3, не финальный v0.1.0-alpha.5. Package
  0.1.0-alpha.4.3-umbrel.3 carries FoxForge commit
  37d1cbed8f73d62acdc1994545bc2f5ee57e816a and immutable amd64/arm64 digest
  sha256:4e652006212db2527804abbd478b7b64fde127414b1dbe22703854280ccfce82.
  Candidate 3 сохраняет setup rollback/idempotency safety и добавляет
  fail-closed X2D material routing: явные 3MF material bindings, compiler-owned
  toolhead, повторную проверку source/topology перед submit и Bambu
  project_file nozzle_mapping только из доказанного маршрута. External 254/255
  сохраняются через ams_mapping2 без автоматического выбора источника или
  угадывания сопла. Физическая проверка Raspberry Pi 5 + Umbrel + X2D + AMS 2
  Pro обязательна до выпуска Alpha 5.

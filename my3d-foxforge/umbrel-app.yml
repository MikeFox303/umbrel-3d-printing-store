releaseNotes: >-
  Pre-Alpha 5 validation Candidate 6, не финальный v0.1.0-alpha.5. Package
  0.1.0-alpha.4.3-umbrel.6 pins FoxForge source
  78ace6f7b7412aa0d3fc58bed095aecdf9920f94 and immutable amd64/arm64 OCI digest
  sha256:b01f1d44199a4413167ee2369c0dfbcafa602312442772d27de18e04c24ed0eb.
  Candidate 6 включает полный C6-10 software gate, staged Add Printer,
  capability-driven Printer Detail/Material Topology, Bambu thermal telemetry,
  fail-closed compiler-owned 3MF routing, AMS/external source handling и
  Bambu-only physical-validation режим автоматического учёта филамента. Umbrel
  по-прежнему передаёт APP_PASSWORD как FoxForge operator token; host networking,
  privileged mode и Docker socket не используются. Реальная проверка Raspberry
  Pi 5 + Umbrel + X2D + AMS 2 Pro обязательна до публикации финального Alpha 5.

manifestVersion: 1.1
id: my3d-foxforge
name: FoxForge
category: automation
version: "0.1.0-alpha.3"
tagline: Единое управление Bambu Lab и Moonraker/Klipper
description: >-
  FoxForge — open-source self-hosted платформа управления 3D-принтерами с
  vendor-independent архитектурой, глубокой поддержкой Bambu Lab,
  Moonraker/Klipper, очередью печати и учётом филамента. Alpha-интерфейс
  доступен на английском, русском и украинском языках.
developer: MikeFox303
website: https://github.com/MikeFox303/FoxForge
repo: https://github.com/MikeFox303/FoxForge
support: https://github.com/MikeFox303/FoxForge/issues
icon: https://raw.githubusercontent.com/MikeFox303/umbrel-3d-printing-store/main/my3d-foxforge/icon.svg
port: 8283
gallery: []
dependencies: []
path: ""
torOnly: false
releaseNotes: >-
  FoxForge v0.1.0-alpha.3 добавляет защищённый командный слой и переводит
  интерфейс из преимущественно read-only режима в управляемый self-hosted
  workflow. Добавлены настройка принтеров из UI, операции с инвентарём,
  безопасная загрузка .gcode/.3mf, постановка в очередь, явный запуск и
  reconciliation неопределённых запусков. Все write-операции используют
  аутентификацию, права, durable idempotency и audit. Образ закреплён на
  immutable amd64/arm64 digest; физическая проверка X2D, OpenKE и Raspberry Pi 5
  остаётся отдельным alpha validation gate.

version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: my3d-foxforge_server_1
      APP_PORT: 8000

  server:
    image: ghcr.io/mikefox303/foxforge:0.1.0-alpha.4.3@sha256:00d1829d4e260aa1035b81e87148ecdfac15fc5ba68f5c50b36d7ed925788b5b
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      TZ: Europe/Kyiv
      FOXFORGE_HOST: 0.0.0.0
      FOXFORGE_PORT: "8000"
      FOXFORGE_DATA_DIR: /data
      FOXFORGE_CONFIG: /data/config.json
      FOXFORGE_COMMAND_TOKEN: "${APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    container_name: my3d-foxforge_server_1

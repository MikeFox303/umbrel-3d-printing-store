name: Sync Bambuddy release

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bambuddy-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Find latest stable Bambuddy release image
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api 'repos/maziggy/bambuddy/releases?per_page=100' \
            --jq '[.[] | select(.draft == false and .prerelease == false) | select(.tag_name | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))][0]')"
          if [[ -z "${release}" || "${release}" == "null" ]]; then
            echo 'No stable Bambuddy release with a supported semantic version was found.' >&2
            exit 1
          fi
          tag="$(jq -er '.tag_name' <<<"${release}")"
          version="${tag#v}"
          ref="ghcr.io/maziggy/bambuddy:${version}"
          raw_manifest="$(docker buildx imagetools inspect --raw "${ref}")"
          if ! jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/arm64") != null' <<<"${raw_manifest}" >/dev/null; then
            echo "${ref} does not contain linux/arm64" >&2
            exit 1
          fi
          if ! jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/amd64") != null' <<<"${raw_manifest}" >/dev/null; then
            echo "${ref} does not contain linux/amd64" >&2
            exit 1
          fi
          digest="$(docker buildx imagetools inspect "${ref}" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a multi-architecture digest for ${ref}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Update immutable Umbrel package reference
        run: node scripts/sync-bambuddy-release.mjs '${{ steps.release.outputs.version }}' '${{ steps.release.outputs.digest }}'

      - name: Commit Store update when required
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Store already references the latest stable Bambuddy image.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add my3d-bambuddy/docker-compose.yml my3d-bambuddy/umbrel-app.yml
          git commit -m "chore: publish Bambuddy ${{ steps.release.outputs.version }}"
          git push

name: Check Bambuddy pin and upstream stable

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-bambuddy-pin
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Store
        uses: actions/checkout@v4

      - name: Read pinned Bambuddy image
        id: pinned
        shell: bash
        run: |
          set -euo pipefail
          line="$(grep -E '^    image: ghcr\.io/(maziggy|mikefox303)/bambuddy:[^@[:space:]]+@sha256:[0-9a-f]{64}$' my3d-bambuddy/docker-compose.yml)"
          ref="${line#*image: }"
          repository="${ref%%:*}"
          tag="${ref#*:}"
          tag="${tag%@sha256:*}"
          digest="sha256:${ref##*@sha256:}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest non-prerelease upstream release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          tag="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/maziggy/bambuddy/releases/latest' \
            | jq -er '.tag_name')"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Refusing non-stable upstream version: ${tag}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Inspect immutable pinned image
        shell: bash
        env:
          IMAGE_REF: ${{ steps.pinned.outputs.ref }}
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect --raw "$IMAGE_REF")"
          jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | (index("linux/amd64") != null and index("linux/arm64") != null)' <<<"$raw" >/dev/null
          resolved="$(docker buildx imagetools inspect "$IMAGE_REF" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          test "$resolved" = '${{ steps.pinned.outputs.digest }}'

      - name: Report migration or newer stable without publishing
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.pinned.outputs.repository }}' == 'ghcr.io/maziggy/bambuddy' ]]; then
            if [[ '${{ steps.upstream.outputs.version }}' != '${{ steps.pinned.outputs.tag }}' ]]; then
              echo '::warning title=New Bambuddy stable available::Upstream stable is ${{ steps.upstream.outputs.version }}; Store remains pinned to ${{ steps.pinned.outputs.tag }} until a new acceptance PR passes all gates.'
            else
              echo 'Store already pins the current upstream stable release.'
            fi
          else
            echo '::notice title=Legacy Bambuddy pin frozen::The Store still references the validated rollback fork image. Automatic publishing is disabled while the official-upstream migration is under acceptance.'
          fi

      - name: Assert workflow cannot publish
        shell: bash
        run: |
          set -euo pipefail
          echo 'This workflow has contents:read only and contains no commit or push step.'

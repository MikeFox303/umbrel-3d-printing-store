name: Check official Bambuddy stable

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-official-bambuddy-stable
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Store
        uses: actions/checkout@v4

      - name: Read pinned official image
        id: pinned
        shell: bash
        run: |
          set -euo pipefail
          line="$(grep -E '^    image: ghcr\.io/maziggy/bambuddy:[^@[:space:]]+@sha256:[0-9a-f]{64}$' my3d-bambuddy/docker-compose.yml)"
          ref="${line#*image: }"
          tag="${ref#ghcr.io/maziggy/bambuddy:}"
          tag="${tag%@sha256:*}"
          digest="sha256:${ref##*@sha256:}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest non-prerelease upstream release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          tag="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/maziggy/bambuddy/releases/latest' \
            | jq -er '.tag_name')"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Refusing non-stable upstream version: ${tag}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Inspect immutable official image
        shell: bash
        env:
          IMAGE_REF: ${{ steps.pinned.outputs.ref }}
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect --raw "$IMAGE_REF")"
          jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | (index("linux/amd64") != null and index("linux/arm64") != null)' <<<"$raw" >/dev/null
          resolved="$(docker buildx imagetools inspect "$IMAGE_REF" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          test "$resolved" = '${{ steps.pinned.outputs.digest }}'

      - name: Report newer stable without publishing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.upstream.outputs.version }}' != '${{ steps.pinned.outputs.tag }}' ]]; then
            echo '::warning title=New Bambuddy stable available::Upstream stable is ${{ steps.upstream.outputs.version }}; Store remains pinned to ${{ steps.pinned.outputs.tag }} until a new migration/acceptance PR passes all gates.'
          else
            echo 'Store already pins the current upstream stable release.'
          fi

      - name: Assert workflow cannot publish
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event_name }}' = 'schedule' -o '${{ github.event_name }}' = 'workflow_dispatch'
          echo 'This workflow has contents:read only and never commits or pushes to main.'

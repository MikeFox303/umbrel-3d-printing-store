name: Store Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: store-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Store tests
        run: node --test tests/*.test.mjs

      - name: Require validated immutable image pins
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^    image: ghcr\.io/mikefox303/bambuddy:.+@sha256:[0-9a-f]{64}$' my3d-bambuddy/docker-compose.yml
          grep -Eq '^    image: ghcr\.io/mikefox303/filaman-system:.+@sha256:[0-9a-f]{64}$' my3d-filaman/docker-compose.yml
          grep -Eq '^    image: ghcr\.io/donkie/spoolman:0\.26\.1@sha256:[0-9a-f]{64}$' my3d-spoolman/docker-compose.yml

      - name: Validate Compose files
        shell: bash
        env:
          APP_DATA_DIR: /tmp/umbrel-app-data
          APP_SEED: test-seed
          APP_PASSWORD: test-password
        run: |
          set -euo pipefail
          cat >/tmp/umbrel-app-proxy.yml <<'EOF'
          services:
            app_proxy:
              image: alpine:3.22
          EOF
          docker compose -f my3d-bambuddy/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null
          docker compose -f my3d-filaman/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null
          docker compose -f my3d-printbuddy/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null
          docker compose -f my3d-spoolman/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null

      - name: Smoke-test Spoolman startup
        shell: bash
        run: |
          set -euo pipefail
          export APP_DATA_DIR=/tmp/spoolman-smoke
          rm -rf "$APP_DATA_DIR"
          mkdir -p "$APP_DATA_DIR"

          cleanup() {
            docker compose --project-name spoolman-smoke -f my3d-spoolman/docker-compose.yml down -v || true
          }
          trap cleanup EXIT

          docker compose --project-name spoolman-smoke -f my3d-spoolman/docker-compose.yml up -d server

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:7912/ >/dev/null; then
              test -f "$APP_DATA_DIR/data/spoolman.db"
              stat -c '%u:%g' "$APP_DATA_DIR/data" | grep -qx '1000:1000'
              exit 0
            fi
            sleep 1
          done

          docker compose --project-name spoolman-smoke -f my3d-spoolman/docker-compose.yml logs server
          exit 1

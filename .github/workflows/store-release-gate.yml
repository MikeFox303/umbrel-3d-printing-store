name: Store Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: store-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Store tests
        run: node --test tests/*.test.mjs

      - name: Validate migration script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/bambuddy-shadow-preflight.sh
          bash -n scripts/bambuddy-live-rc.sh
          grep -Fq '1.2.5.5-x2d.73@sha256:9abf0d5bfb612dd1f473a7632f2b7aa404ef06db759e979b388bd7466cc84fb0' scripts/bambuddy-shadow-preflight.sh
          grep -Fq '1.2.5.5-x2d.73@sha256:9abf0d5bfb612dd1f473a7632f2b7aa404ef06db759e979b388bd7466cc84fb0' scripts/bambuddy-live-rc.sh
          grep -Fq 'network_mode: host' scripts/bambuddy-live-rc.sh

      - name: Require validated immutable image pins and Virtual Printer host network
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^    image: ghcr\.io/maziggy/bambuddy:[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?@sha256:[0-9a-f]{64}$' my3d-bambuddy/docker-compose.yml
          grep -Eq '^    image: ghcr\.io/mikefox303/filaman-system:.+@sha256:[0-9a-f]{64}$' my3d-filaman/docker-compose.yml
          grep -Eq '^    image: ghcr\.io/donkie/spoolman:0\.26\.1@sha256:[0-9a-f]{64}$' my3d-spoolman/docker-compose.yml
          grep -Eq '^[[:space:]]*network_mode:[[:space:]]*host([[:space:]]|$)' my3d-bambuddy/docker-compose.yml
          grep -Eq '^[[:space:]]*APP_HOST:[[:space:]]*192\.168\.0\.100([[:space:]]|$)' my3d-bambuddy/docker-compose.yml
          grep -Eq '^[[:space:]]*VIRTUAL_PRINTER_ADVERTISE_ADDRESS:[[:space:]]*192\.168\.0\.100([[:space:]]|$)' my3d-bambuddy/docker-compose.yml
          grep -Eq '^[[:space:]]*VIRTUAL_PRINTER_PASV_ADDRESS:[[:space:]]*192\.168\.0\.100([[:space:]]|$)' my3d-bambuddy/docker-compose.yml
          grep -Eq '^[[:space:]]*-[[:space:]]*NET_BIND_SERVICE([[:space:]]|$)' my3d-bambuddy/docker-compose.yml
          ! grep -Eq 'ghcr\.io/mikefox303/bambuddy|:latest(@|$)|:daily(@|$)' my3d-bambuddy/docker-compose.yml

      - name: Validate Compose files
        shell: bash
        env:
          APP_DATA_DIR: /tmp/umbrel-app-data
          APP_SEED: test-seed
          APP_PASSWORD: test-password
        run: |
          set -euo pipefail
          cat >/tmp/umbrel-app-proxy.yml <<'EOF'
          services:
            app_proxy:
              image: alpine:3.22
          EOF
          docker compose -f my3d-bambuddy/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null
          docker compose -f my3d-filaman/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null
          docker compose -f my3d-printbuddy/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null
          docker compose -f my3d-spoolman/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null

      - name: Smoke-test Spoolman startup
        shell: bash
        run: |
          set -euo pipefail
          export APP_DATA_DIR=/tmp/spoolman-smoke
          rm -rf "$APP_DATA_DIR"
          mkdir -p "$APP_DATA_DIR"

          cleanup() {
            docker compose --project-name spoolman-smoke -f my3d-spoolman/docker-compose.yml down -v || true
          }
          trap cleanup EXIT

          docker compose --project-name spoolman-smoke -f my3d-spoolman/docker-compose.yml up -d server

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:7912/ >/dev/null; then
              test -f "$APP_DATA_DIR/data/spoolman.db"
              stat -c '%u:%g' "$APP_DATA_DIR/data" | grep -qx '1000:1000'
              exit 0
            fi
            sleep 1
          done

          docker compose --project-name spoolman-smoke -f my3d-spoolman/docker-compose.yml logs server
          exit 1

  bambuddy-image:
    name: Bambuddy ${{ matrix.platform }} runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Anonymous pull and runtime smoke test
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          image="$(sed -n 's/^[[:space:]]*image:[[:space:]]*//p' my3d-bambuddy/docker-compose.yml | head -1)"
          test -n "$image"
          docker pull --platform "$PLATFORM" "$image"

          root="/tmp/bambuddy-${PLATFORM##*/}"
          rm -rf "$root"
          mkdir -p "$root/data" "$root/logs"

          cleanup() {
            docker rm -f bambuddy-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --platform "$PLATFORM" -d \
            --name bambuddy-runtime \
            -p 127.0.0.1:18000:8000 \
            -e TZ=UTC \
            -e PUID=1000 \
            -e PGID=1000 \
            -e PORT=8000 \
            -v "$root/data:/app/data" \
            -v "$root/logs:/app/logs" \
            "$image"

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health >/dev/null; then
              docker inspect --format '{{.State.Running}}' bambuddy-runtime | grep -qx true
              test -f "$root/data/bambuddy.db"
              stat -c '%u:%g' "$root/data" | grep -qx '1000:1000'
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' bambuddy-runtime)" != true ]]; then
              break
            fi
            sleep 1
          done

          docker logs bambuddy-runtime
          docker inspect bambuddy-runtime
          exit 1

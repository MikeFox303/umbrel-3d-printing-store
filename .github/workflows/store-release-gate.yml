name: Store Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: store-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Store tests
        run: node --test tests/*.test.mjs

      - name: Validate Bambuddy Manager source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile my3d-bambuddy-manager/src/server.py
          python3 -m unittest discover -s tests -p 'test_bambuddy_manager.py' -v
          cmp my3d-bambuddy-manager/src/server.py my3d-bambuddy-manager/server.py.template

      - name: Require validated immutable image pins and Virtual Printer host network
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^    image: ghcr\.io/maziggy/bambuddy:[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?@sha256:[0-9a-f]{64}$' my3d-bambuddy/docker-compose.yml
          grep -Eq '^    image: ghcr\.io/mikefox303/filaman-system:.+@sha256:[0-9a-f]{64}$' my3d-filaman/docker-compose.yml
          grep -Eq '^    image: ghcr\.io/donkie/spoolman:0\.26\.1@sha256:[0-9a-f]{64}$' my3d-spoolman/docker-compose.yml
          grep -Eq '^    image: python:3\.13\.15-alpine3\.24@sha256:[0-9a-f]{64}$' my3d-bambuddy-manager/docker-compose.yml
          grep -Eq '^[[:space:]]*network_mode:[[:space:]]*host([[:space:]]|$)' my3d-bambuddy/docker-compose.yml
          grep -Eq '^[[:space:]]*APP_HOST:[[:space:]]*192\.168\.0\.100([[:space:]]|$)' my3d-bambuddy/docker-compose.yml
          grep -Eq '^[[:space:]]*VIRTUAL_PRINTER_ADVERTISE_ADDRESS:[[:space:]]*192\.168\.0\.100([[:space:]]|$)' my3d-bambuddy/docker-compose.yml
          grep -Eq '^[[:space:]]*VIRTUAL_PRINTER_PASV_ADDRESS:[[:space:]]*192\.168\.0\.100([[:space:]]|$)' my3d-bambuddy/docker-compose.yml
          grep -Eq '^[[:space:]]*-[[:space:]]*NET_BIND_SERVICE([[:space:]]|$)' my3d-bambuddy/docker-compose.yml
          ! grep -Eq 'ghcr\.io/mikefox303/bambuddy|:latest(@|$)|:daily(@|$)' my3d-bambuddy/docker-compose.yml
          grep -Fq '/var/run/docker.sock:/var/run/docker.sock' my3d-bambuddy-manager/docker-compose.yml
          grep -Fq 'export APP_BAMBUDDY_APP_DIR="${EXPORTS_APP_DIR}"' my3d-bambuddy/exports.sh
          grep -Fq 'export APP_BAMBUDDY_DATA_DIR="${EXPORTS_APP_DATA_DIR}"' my3d-bambuddy/exports.sh
          grep -Fq '${APP_BAMBUDDY_APP_DIR}:/umbrel-app-data/my3d-bambuddy' my3d-bambuddy-manager/docker-compose.yml
          grep -Fq '${APP_BAMBUDDY_DATA_DIR}:/umbrel-app-data/my3d-bambuddy/data' my3d-bambuddy-manager/docker-compose.yml
          ! grep -Fq '/home/umbrel/umbrel/app-data/my3d-bambuddy' my3d-bambuddy-manager/docker-compose.yml
          ! grep -Fq 'PROXY_AUTH_ADD: "false"' my3d-bambuddy-manager/docker-compose.yml
          ! grep -Fq "PROXY_AUTH_ADD: 'false'" my3d-bambuddy-manager/docker-compose.yml
          ! grep -Eq 'PROXY_AUTH_ADD:[[:space:]]*false([[:space:]]|$)' my3d-bambuddy-manager/docker-compose.yml

      - name: Validate channel metadata
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.channel == "stable" and .available == true and (.immutableImage | test("^ghcr.io/maziggy/bambuddy:[0-9.]+@sha256:[0-9a-f]{64}$"))' channels/bambuddy/stable.json >/dev/null
          jq -e '.channel == "beta" and ((.available == false and .immutableImage == null) or (.available == true and (.immutableImage | test("^ghcr.io/maziggy/bambuddy:daily@sha256:[0-9a-f]{64}$"))))' channels/bambuddy/beta.json >/dev/null

      - name: Validate Compose files
        shell: bash
        env:
          APP_DATA_DIR: /tmp/umbrel-app-data
          APP_SEED: test-seed
          APP_PASSWORD: test-password
          APP_BAMBUDDY_APP_DIR: /tmp/bambuddy-app-definition
          APP_BAMBUDDY_DATA_DIR: /tmp/bambuddy-persistent-data
        run: |
          set -euo pipefail
          cat >/tmp/umbrel-app-proxy.yml <<'EOF'
          services:
            app_proxy:
              image: alpine:3.22
          EOF
          docker compose -f my3d-bambuddy/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null
          docker compose -f my3d-filaman/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null
          docker compose -f my3d-printbuddy/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null
          docker compose -f my3d-spoolman/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null
          docker compose -f my3d-bambuddy-manager/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null

      - name: Smoke-test Bambuddy Manager startup
        shell: bash
        run: |
          set -euo pipefail
          export APP_DATA_DIR=/tmp/bambuddy-manager-smoke
          export APP_BAMBUDDY_APP_DIR=/tmp/bambuddy-manager-target
          export APP_BAMBUDDY_DATA_DIR=/tmp/bambuddy-manager-target-data
          rm -rf "$APP_DATA_DIR" "$APP_BAMBUDDY_APP_DIR" "$APP_BAMBUDDY_DATA_DIR"
          mkdir -p "$APP_DATA_DIR/data" "$APP_BAMBUDDY_APP_DIR" "$APP_BAMBUDDY_DATA_DIR"
          cp my3d-bambuddy-manager/server.py.template "$APP_DATA_DIR/server.py.template"
          cat >/tmp/umbrel-app-proxy.yml <<'EOF'
          services:
            app_proxy:
              image: alpine:3.22
          EOF

          cleanup() {
            docker compose --project-name bambuddy-manager-smoke -f my3d-bambuddy-manager/docker-compose.yml -f /tmp/umbrel-app-proxy.yml down -v || true
          }
          trap cleanup EXIT

          docker compose --project-name bambuddy-manager-smoke -f my3d-bambuddy-manager/docker-compose.yml -f /tmp/umbrel-app-proxy.yml up -d server
          for attempt in $(seq 1 30); do
            if docker exec my3d-bambuddy-manager_server_1 python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2)" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs my3d-bambuddy-manager_server_1 || true
          exit 1

      - name: Smoke-test Spoolman startup
        shell: bash
        run: |
          set -euo pipefail
          export APP_DATA_DIR=/tmp/spoolman-smoke
          rm -rf "$APP_DATA_DIR"
          mkdir -p "$APP_DATA_DIR"

          cleanup() {
            docker compose --project-name spoolman-smoke -f my3d-spoolman/docker-compose.yml down -v || true
          }
          trap cleanup EXIT

          docker compose --project-name spoolman-smoke -f my3d-spoolman/docker-compose.yml up -d server

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:7912/ >/dev/null; then
              test -f "$APP_DATA_DIR/data/spoolman.db"
              stat -c '%u:%g' "$APP_DATA_DIR/data" | grep -qx '1000:1000'
              exit 0
            fi
            sleep 1
          done

          docker compose --project-name spoolman-smoke -f my3d-spoolman/docker-compose.yml logs server
          exit 1

  bambuddy-image:
    name: Bambuddy ${{ matrix.platform }} runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Anonymous pull and runtime smoke test
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          image="$(sed -n 's/^[[:space:]]*image:[[:space:]]*//p' my3d-bambuddy/docker-compose.yml | head -1)"
          test -n "$image"
          docker pull --platform "$PLATFORM" "$image"

          root="/tmp/bambuddy-${PLATFORM##*/}"
          rm -rf "$root"
          mkdir -p "$root/data" "$root/logs"

          cleanup() {
            docker rm -f bambuddy-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --platform "$PLATFORM" -d \
            --name bambuddy-runtime \
            -p 127.0.0.1:18000:8000 \
            -e TZ=UTC \
            -e PUID=1000 \
            -e PGID=1000 \
            -e PORT=8000 \
            -v "$root/data:/app/data" \
            -v "$root/logs:/app/logs" \
            "$image"

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health >/dev/null; then
              docker inspect --format '{{.State.Running}}' bambuddy-runtime | grep -qx true
              test -f "$root/data/bambuddy.db"
              stat -c '%u:%g' "$root/data" | grep -qx '1000:1000'
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' bambuddy-runtime)" != true ]]; then
              break
            fi
            sleep 1
          done

          docker logs bambuddy-runtime
          docker inspect bambuddy-runtime
          exit 1

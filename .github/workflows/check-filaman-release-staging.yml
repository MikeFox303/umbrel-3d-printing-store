name: Check FilaMan release provenance (staging only)

on:
  push:
    branches:
      - sync/bambuddy-x2d-1d704084
    paths:
      - .github/workflows/check-filaman-release-staging.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query latest successful FilaMan image build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            'https://api.github.com/repos/MikeFox303/filaman-system/actions/workflows/build-image.yml/runs?branch=main&status=success&per_page=1')"
          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson release "$(jq '.workflow_runs[0] | {id, run_number, head_sha, status, conclusion, event, created_at, updated_at}' <<<"$run")" \
            '{checked_at:$checked_at, release:$release}' \
            > .staging-filaman-release-status.json
      - name: Publish staging provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging-filaman-release-status.json
          git commit -m 'ci: record FilaMan release provenance'
          git push

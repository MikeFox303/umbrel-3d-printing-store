name: Check Bambuddy release pipeline (staging only)
# refresh target: c896f6e85de57c866e15d72289b34b49c1157e0a
# refresh: 2026-08-23T03:00:00+03:00

on:
  push:
    branches:
      - sync/bambuddy-x2d-1d704084
    paths:
      - .github/workflows/check-bambuddy-release-staging.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query Bambuddy CI and image build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "$1"
          }
          ci="$(api 'https://api.github.com/repos/MikeFox303/bambuddy/actions/workflows/ci.yml/runs?branch=main&per_page=1')"
          image="$(api 'https://api.github.com/repos/MikeFox303/bambuddy/actions/workflows/build-x2d-image.yml/runs?branch=main&per_page=1')"
          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson ci "$(jq '.workflow_runs[0] | {id, run_number, head_sha, status, conclusion, event, created_at, updated_at}' <<<"$ci")" \
            --argjson image "$(jq '.workflow_runs[0] | {id, run_number, head_sha, status, conclusion, event, created_at, updated_at}' <<<"$image")" \
            '{checked_at:$checked_at, ci:$ci, image:$image}' \
            > .staging-bambuddy-release-status.json

      - name: Publish staging status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging-bambuddy-release-status.json
          git commit -m 'ci: record Bambuddy release pipeline status'
          git push

name: Sync validated FilaMan release

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional localized image tag'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-filaman-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Store
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: hashFiles('TEST_PIN') == ''

      - name: Find latest successful validated image
        id: release
        if: hashFiles('TEST_PIN') == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_TAG}" ]]; then
            tag="${REQUESTED_TAG}"
          else
            run="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              'https://api.github.com/repos/MikeFox303/filaman-system/actions/workflows/build-image.yml/runs?branch=main&status=success&per_page=1')"
            run_number="$(jq -er '.workflow_runs[0].run_number' <<<"${run}")"
            head_sha="$(jq -er '.workflow_runs[0].head_sha' <<<"${run}")"
            upstream_version="$(curl --fail --silent --show-error "https://raw.githubusercontent.com/MikeFox303/filaman-system/${head_sha}/version.txt" | tr -d '\r\n')"
            tag="${upstream_version}-localized.${run_number}"
          fi
          if [[ ! "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-localized\.[0-9]+$ ]]; then
            echo "Unsupported image tag: ${tag}" >&2
            exit 1
          fi
          ref="ghcr.io/mikefox303/filaman-system:${tag}"
          raw_manifest="$(docker buildx imagetools inspect --raw "${ref}")"
          if ! jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | (index("linux/amd64") != null and index("linux/arm64") != null)' <<<"${raw_manifest}" >/dev/null; then
            echo "${ref} does not contain both linux/amd64 and linux/arm64" >&2
            exit 1
          fi
          digest="$(docker buildx imagetools inspect "${ref}" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a multi-architecture digest for ${ref}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Update immutable Umbrel package reference
        if: hashFiles('TEST_PIN') == ''
        run: node scripts/sync-filaman-release.mjs '${{ steps.release.outputs.tag }}' '${{ steps.release.outputs.digest }}'

      - name: Validate Store before publishing
        if: hashFiles('TEST_PIN') == ''
        shell: bash
        env:
          APP_DATA_DIR: /tmp/umbrel-app-data
          APP_SEED: test-seed
          APP_PASSWORD: test-password
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          grep -Eq '^    image: ghcr\.io/maziggy/bambuddy:[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?@sha256:[0-9a-f]{64}$' my3d-bambuddy/docker-compose.yml
          grep -Eq '^    image: ghcr\.io/mikefox303/filaman-system:.+@sha256:[0-9a-f]{64}$' my3d-filaman/docker-compose.yml
          cat >/tmp/umbrel-app-proxy.yml <<'EOF'
          services:
            app_proxy:
              image: alpine:3.22
          EOF
          docker compose -f my3d-bambuddy/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null
          docker compose -f my3d-filaman/docker-compose.yml -f /tmp/umbrel-app-proxy.yml config >/dev/null

      - name: Commit Store update when required
        if: hashFiles('TEST_PIN') == ''
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Store already references the latest validated image.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add my3d-filaman/docker-compose.yml my3d-filaman/umbrel-app.yml
          git commit -m "chore: publish FilaMan ${{ steps.release.outputs.tag }}"
          git push

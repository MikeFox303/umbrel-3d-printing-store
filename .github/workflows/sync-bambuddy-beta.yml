name: Sync Bambuddy beta channel

on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-bambuddy-beta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Store main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Resolve latest upstream daily beta
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          releases="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/maziggy/bambuddy/releases?per_page=30')"

          release="$(jq -cer '
            [ .[]
              | select(.draft == false and .prerelease == true)
              | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+b[0-9]+-daily\\.[0-9]{8}$"))
            ][0]
          ' <<<"$releases")"

          tag="$(jq -er '.tag_name' <<<"$release")"
          version="${tag#v}"
          image='ghcr.io/maziggy/bambuddy:daily'

          raw="$(docker buildx imagetools inspect --raw "$image")"
          jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"]
            | (index("linux/amd64") != null and index("linux/arm64") != null)
          ' <<<"$raw" >/dev/null

          digest="$(docker buildx imagetools inspect "$image" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          immutable="${image}@${digest}"
          resolved="$(docker buildx imagetools inspect "$immutable" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          test "$resolved" = "$digest"

          current_version="$(jq -r '.version // ""' channels/bambuddy/beta.json 2>/dev/null || true)"
          current_digest="$(jq -r '.digest // ""' channels/bambuddy/beta.json 2>/dev/null || true)"

          echo "Current beta metadata: ${current_version:-<none>} ${current_digest:-<none>}"
          echo "Latest upstream beta: $version $digest"

          if [[ "$current_version" == "$version" && "$current_digest" == "$digest" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Store already publishes this tested beta digest."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "immutable=$immutable" >> "$GITHUB_OUTPUT"

      - name: Smoke-test beta image on amd64 and arm64
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.upstream.outputs.immutable }}
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f bambuddy-beta-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for platform in linux/amd64 linux/arm64; do
            cleanup
            arch="${platform##*/}"
            root="/tmp/bambuddy-beta-${arch}"
            rm -rf "$root"
            mkdir -p "$root/data" "$root/logs"

            docker pull --platform "$platform" "$IMAGE"
            docker run --platform "$platform" -d \
              --name bambuddy-beta-smoke \
              -p 127.0.0.1:18001:8000 \
              -e TZ=UTC \
              -e PUID=1000 \
              -e PGID=1000 \
              -e PORT=8000 \
              -v "$root/data:/app/data" \
              -v "$root/logs:/app/logs" \
              "$IMAGE"

            healthy=false
            for attempt in $(seq 1 120); do
              if curl --fail --silent --show-error http://127.0.0.1:18001/health >/dev/null 2>&1; then
                healthy=true
                break
              fi
              if [[ "$(docker inspect --format '{{.State.Running}}' bambuddy-beta-smoke)" != true ]]; then
                break
              fi
              sleep 1
            done

            if [[ "$healthy" != true ]]; then
              docker logs bambuddy-beta-smoke || true
              exit 1
            fi

            test -f "$root/data/bambuddy.db"
            docker rm -f bambuddy-beta-smoke >/dev/null
          done

      - name: Update beta channel metadata
        if: steps.upstream.outputs.changed == 'true'
        run: |
          node scripts/sync-bambuddy-beta.mjs \
            '${{ steps.upstream.outputs.version }}' \
            '${{ steps.upstream.outputs.digest }}'
          jq -e '.available == true and (.immutableImage | test("^ghcr.io/maziggy/bambuddy:daily@sha256:[0-9a-f]{64}$"))' channels/bambuddy/beta.json >/dev/null

      - name: Run Store tests
        if: steps.upstream.outputs.changed == 'true'
        run: node --test tests/*.test.mjs

      - name: Publish beta channel metadata
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels/bambuddy/beta.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish Bambuddy beta ${VERSION}"
          git push origin HEAD:main

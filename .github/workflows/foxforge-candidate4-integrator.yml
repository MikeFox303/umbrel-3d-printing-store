name: FoxForge candidate 4 integrator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'foxforge/pre-alpha-5-validation-4'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: foxforge/pre-alpha-5-validation-4
          fetch-depth: 0

      - name: Apply exact Candidate 4 package edits
        run: |
          python - <<'PY'
          from pathlib import Path

          SOURCE_3 = '37d1cbed8f73d62acdc1994545bc2f5ee57e816a'
          SOURCE_4 = 'c11f7145b4354aa79c8f0fad223648240e652bac'
          DIGEST_3 = 'sha256:4e652006212db2527804abbd478b7b64fde127414b1dbe22703854280ccfce82'
          DIGEST_4 = 'sha256:75d656bafcafb4e0e566548f6cca941244d29fef1bbc5be98e425f375246056a'
          VERSION_3 = '0.1.0-alpha.4.3-umbrel.3'
          VERSION_4 = '0.1.0-alpha.4.3-umbrel.4'

          def replace(path: str, old: str, new: str, count: int | None = None) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              matches = text.count(old)
              expected = count if count is not None else 1
              assert matches == expected, f'{path}: expected {expected} matches for {old!r}, got {matches}'
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'my3d-foxforge/docker-compose.yml',
              f'ghcr.io/mikefox303/foxforge:sha-37d1cbe@{DIGEST_3}',
              f'ghcr.io/mikefox303/foxforge:sha-c11f714@{DIGEST_4}',
          )

          package = Path('my3d-foxforge/foxforge-package.json')
          text = package.read_text(encoding='utf-8')
          assert text.count(SOURCE_3) == 1
          assert text.count(DIGEST_3) == 1
          text = text.replace(SOURCE_3, SOURCE_4).replace(DIGEST_3, DIGEST_4)
          package.write_text(text, encoding='utf-8')

          manifest = Path('my3d-foxforge/umbrel-app.yml')
          text = manifest.read_text(encoding='utf-8')
          assert f'version: "{VERSION_3}"' in text
          text = text.replace(f'version: "{VERSION_3}"', f'version: "{VERSION_4}"', 1)
          old_notes = '''releaseNotes: >-\n  Pre-Alpha 5 validation candidate 3, не финальный v0.1.0-alpha.5. Package\n  0.1.0-alpha.4.3-umbrel.3 carries FoxForge commit\n  37d1cbed8f73d62acdc1994545bc2f5ee57e816a and immutable amd64/arm64 digest\n  sha256:4e652006212db2527804abbd478b7b64fde127414b1dbe22703854280ccfce82.\n  Candidate 3 сохраняет setup rollback/idempotency safety и добавляет\n  fail-closed X2D material routing: явные 3MF material bindings, compiler-owned\n  toolhead, повторную проверку source/topology перед submit и Bambu\n  project_file nozzle_mapping только из доказанного маршрута. External 254/255\n  сохраняются через ams_mapping2 без автоматического выбора источника или\n  угадывания сопла. Физическая проверка Raspberry Pi 5 + Umbrel + X2D + AMS 2\n  Pro обязательна до выпуска Alpha 5.\n'''
          new_notes = '''releaseNotes: >-\n  Pre-Alpha 5 validation candidate 4, не финальный v0.1.0-alpha.5. Package\n  0.1.0-alpha.4.3-umbrel.4 carries FoxForge commit\n  c11f7145b4354aa79c8f0fad223648240e652bac and immutable amd64/arm64 digest\n  sha256:75d656bafcafb4e0e566548f6cca941244d29fef1bbc5be98e425f375246056a.\n  Candidate 4 сохраняет fail-closed X2D material routing из Candidate 3 и\n  добавляет operator-facing 3MF material binding review, безопасные подсказки\n  приватных подсетей для Bambu discovery, Material Topology UI с явными\n  fixed/dynamic/unknown/stale состояниями и закрытие EN/RU/UK responsive\n  интерфейса на phone/tablet/desktop/ultrawide. Физическая проверка Raspberry\n  Pi 5 + Umbrel + X2D + AMS 2 Pro обязательна до выпуска Alpha 5.\n'''
          assert text.count(old_notes) == 1
          manifest.write_text(text.replace(old_notes, new_notes, 1), encoding='utf-8')

          readme = Path('my3d-foxforge/README.md')
          text = readme.read_text(encoding='utf-8')
          for old, new, expected in [
              ('Candidate 3 is built from FoxForge source commit `37d1cbed8f73d62acdc1994545bc2f5ee57e816a`', 'Candidate 4 is built from FoxForge source commit `c11f7145b4354aa79c8f0fad223648240e652bac`', 1),
              ('`0.1.0-alpha.4.3-umbrel.3`', '`0.1.0-alpha.4.3-umbrel.4`', 2),
              ('`-umbrel.3` identifies the third installable physical-validation package', '`-umbrel.4` identifies the fourth installable physical-validation package', 1),
              ('Compared with the current Alpha 4.3 release package, candidate 3 includes', 'Compared with the current Alpha 4.3 release package, candidate 4 includes', 1),
              ('Candidate 3 must not be promoted to final Alpha 5 based only on Store CI.', 'Candidate 4 must not be promoted to final Alpha 5 based only on Store CI.', 1),
          ]:
              matches = text.count(old)
              assert matches == expected, f'README: expected {expected} matches for {old!r}, got {matches}'
              text = text.replace(old, new)

          anchor = '- Bambu external sources 254/255 remain `-1` in flat `ams_mapping`, retain their real source IDs in `ams_mapping2`, and obtain a nozzle only from the proven toolhead route;\n'
          additions = '''- the queue UI now inspects staged 3MF print plans, requires explicit operator material-source bindings, shows compatibility/route blockers and never sends a client-owned toolhead decision;\n- Bambu discovery can suggest bounded server-visible RFC1918 subnets, while keeping manual CIDR entry and the same authenticated discovery/preflight boundary;\n- Printer Detail now renders typed Material Topology routes with friendly source/toolhead labels and explicit `fixed`, `dynamic`, `unknown` and stale states instead of inferring routing from a Bambu model name;\n- EN/RU/UK localization and responsive acceptance now cover the approved 390x844, 900x1024, 1920x1080 and 5120x1440 interface targets;\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + additions, 1)
          readme.write_text(text, encoding='utf-8')

          tests = Path('tests/foxforge-package.test.mjs')
          text = tests.read_text(encoding='utf-8')
          replacements = [
              ("const sourceSha = '37d1cbed8f73d62acdc1994545bc2f5ee57e816a';", "const sourceSha = 'c11f7145b4354aa79c8f0fad223648240e652bac';"),
              ("const digest = 'sha256:4e652006212db2527804abbd478b7b64fde127414b1dbe22703854280ccfce82';", "const digest = 'sha256:75d656bafcafb4e0e566548f6cca941244d29fef1bbc5be98e425f375246056a';"),
              ("const image = `ghcr.io/mikefox303/foxforge:sha-37d1cbe@${digest}`;", "const image = `ghcr.io/mikefox303/foxforge:sha-c11f714@${digest}`;"),
              ("const packageVersion = '0.1.0-alpha.4.3-umbrel.3';", "const packageVersion = '0.1.0-alpha.4.3-umbrel.4';"),
              ("assert.match(manifest, /^version: \"0\\.1\\.0-alpha\\.4\\.3-umbrel\\.3\"$/m);", "assert.match(manifest, /^version: \"0\\.1\\.0-alpha\\.4\\.3-umbrel\\.4\"$/m);"),
              ("assert.match(readme, /package-local identity `0\\.1\\.0-alpha\\.4\\.3-umbrel\\.3`/);", "assert.match(readme, /package-local identity `0\\.1\\.0-alpha\\.4\\.3-umbrel\\.4`/);"),
              ("test('FoxForge candidate 3 preserves setup safety and documents compiled Bambu routing', () => {", "test('FoxForge candidate 4 preserves routing safety and adds operator-facing validation UX', () => {"),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, f'tests: missing or duplicate {old!r}'
              text = text.replace(old, new, 1)

          insertion = "  assert.match(manifest, /External 254\\/255/);\n"
          extra = '''  assert.match(readme, /queue UI now inspects staged 3MF print plans/);\n  assert.match(readme, /bounded server-visible RFC1918 subnets/);\n  assert.match(readme, /typed Material Topology routes/);\n  assert.match(readme, /390x844, 900x1024, 1920x1080 and 5120x1440/);\n'''
          assert text.count(insertion) == 1
          text = text.replace(insertion, insertion + extra, 1)
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Commit package update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add my3d-foxforge tests/foxforge-package.test.mjs
          git commit -m 'foxforge: prepare Pre-Alpha 5 validation candidate 4'
          git push origin HEAD:foxforge/pre-alpha-5-validation-4

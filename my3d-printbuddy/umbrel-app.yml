manifestVersion: 1.1
id: my3d-printbuddy
name: Printbuddy
category: automation
version: "0.2.5.3-umbrel.1"
tagline: Единая панель управления 3D-принтерами
description: >-
  Неофициальный Community App package для Printbuddy — self-hosted платформы
  мониторинга и управления парком 3D-принтеров. Поддерживаются Bambu Lab,
  Klipper/Moonraker, Prusa и другие провайдеры; доступны мониторинг, файлы,
  очередь, архив печатей, инвентарь филамента, AMS и Virtual Printer.
developer: VMHOMELAB
website: https://wiki.printbuddy.tech/
repo: https://github.com/vmhomelab/printbuddy
support: https://github.com/vmhomelab/printbuddy/issues
icon: https://raw.githubusercontent.com/vmhomelab/printbuddy/main/static/img/android-chrome-512x512.png
port: 8281
gallery: []
dependencies: []
path: ""
torOnly: false
releaseNotes: >-
  Обновление до стабильного upstream Printbuddy v0.2.5.3. Добавлена
  read-only синхронизация профилей Orca Cloud, ZIP-скачивание нескольких
  файлов библиотеки, архив метаданных MakerWorld и определение материала из
  G-code. Notify/Live Activities поддерживают нескольких получателей и кнопки
  действий; улучшены переподключение Bambu, повтор офлайн-принтеров и
  освобождение очереди Virtual Printer после загрузки. Сохраняются
  multi-architecture Docker image для amd64/arm64, host networking и постоянные
  data/logs каталоги Umbrel.

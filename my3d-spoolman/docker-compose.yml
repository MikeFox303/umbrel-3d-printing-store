version: "3.8"

services:
  server:
    image: ghcr.io/donkie/spoolman:0.27.1@sha256:1ebb4f6a62c2e72a07f18b07ebfdbd96322f5bc2eb72570af3088f68d7c393b1
    restart: on-failure
    init: true
    stop_grace_period: 30s

    # Docker creates a missing bind-mount source as root. Spoolman drops to
    # UID/GID 1000 before opening SQLite, so normalize the Umbrel data folder
    # before handing control back to the upstream entrypoint.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /home/app/.local/share/spoolman
        chown -R 1000:1000 /home/app/.local/share/spoolman
        exec /home/app/spoolman/entrypoint.sh

    environment:
      TZ: Europe/Kyiv
      PUID: "1000"
      PGID: "1000"

    ports:
      - "7912:8000"

    volumes:
      - ${APP_DATA_DIR}/data:/home/app/.local/share/spoolman

manifestVersion: 1.1
id: my3d-spoolman
name: Spoolman
category: automation
version: "0.26.1-umbrel.2"
tagline: Централизованный учёт катушек филамента
description: >-
  Неофициальный Community App package для Spoolman — self-hosted базы
  катушек и филаментов для 3D-печати. Spoolman хранит производителей,
  материалы, цвета, остатки, стоимость и места хранения, поддерживает QR-
  метки и интегрируется с Moonraker/Klipper, OctoPrint и другими клиентами
  через REST API и WebSocket.
developer: Donkie
website: https://github.com/Donkie/Spoolman/wiki
repo: https://github.com/Donkie/Spoolman
support: https://github.com/Donkie/Spoolman/issues
icon: https://github.com/Donkie/Spoolman/assets/2332094/3c120b3a-1422-42f6-a16b-8d5a07c33000
port: 7912
gallery:
  - https://raw.githubusercontent.com/Donkie/Spoolman/v0.26.1/.github/media/client-screenshot.png
  - https://raw.githubusercontent.com/Donkie/Spoolman/v0.26.1/.github/media/dashboard-screenshot.png
  - https://raw.githubusercontent.com/Donkie/Spoolman/v0.26.1/.github/media/label-designer-screenshot.png
dependencies: []
path: ""
torOnly: false
releaseNotes: >-
  Исправлен первый запуск в UmbrelOS: каталог persistent data теперь
  автоматически получает UID/GID 1000 перед запуском Spoolman, поэтому SQLite
  может создать spoolman.db даже если bind-mount был создан Docker от root.
  Upstream остаётся v0.26.1, Web UI — порт 7912.
